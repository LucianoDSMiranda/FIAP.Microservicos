apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
type: Opaque
# ATENÇÃO: valores de exemplo (placeholders). Não commitar segredos reais.
# Preencha os valores reais antes do apply, ou crie o Secret manualmente:
#   kubectl create secret generic rabbitmq-secret \
#     --from-literal=RABBITMQ_DEFAULT_USER='...' \
#     --from-literal=RABBITMQ_DEFAULT_PASS='...'
# Devem bater com RABBITMQ_USERNAME/PASSWORD dos secrets de users e catalog.
stringData:
  RABBITMQ_DEFAULT_USER: "CHANGE_ME_RABBITMQ_USER"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME_RABBITMQ_PASSWORD"
