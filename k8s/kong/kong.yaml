apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config

data:
  config.yaml: |
    _format_version: "3.0"

    consumers:
      - username: anonymous

      - username: cloudgames-user
        jwt_secrets:
          - key: cloudgames-key
            # Placeholder — preencha antes do apply com o MESMO valor de JWT_SECRET
            # usado em users-secret e catalog-secret.
            secret: CHANGE_ME_JWT_SECRET

    services:
      - name: users-api
        url: http://users-api-service:80

        routes:
          - name: users-route
            paths:
              - /users
            strip_path: true
            preserve_host: true

            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
                  anonymous: anonymous

      - name: catalog-api
        url: http://catalog-api-service:80

        routes:
          - name: catalog-route
            paths:
              - /catalog
            strip_path: true
            preserve_host: true

            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
                  anonymous: anonymous

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      containers:
        - name: kong
          image: kong:3.6

          ports:
            - containerPort: 8000
            - containerPort: 8001

          env:
            - name: KONG_DATABASE
              value: "off"

            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/config/config.yaml

            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout

            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout

            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr

            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr

            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001

          volumeMounts:
            - name: kong-config-volume
              mountPath: /kong/config

      volumes:
        - name: kong-config-volume
          configMap:
            name: kong-config

---
apiVersion: v1
kind: Service
metadata:
  name: kong-service

spec:
  selector:
    app: kong

  # Expõe apenas a porta proxy externamente (ponto de entrada da aplicação).
  # A porta admin (8001) NÃO é publicada para evitar expor a Admin API do Kong
  # na internet; use `kubectl port-forward deployment/kong 8001:8001` se precisar.
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000

  type: LoadBalancer
