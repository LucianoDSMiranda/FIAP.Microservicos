apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

      - name: Redis
        type: redis-datasource
        uid: redis
        access: proxy
        url: redis://redis-service:6379
        editable: false
        jsonData:
          client: standalone
          poolSize: 5

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: CloudGames
        orgId: 1
        folder: CloudGames
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards

  cloudgames-overview.json: |
    {
      "id": null,
      "uid": "cloudgames-overview",
      "title": "CloudGames - Overview",
      "tags": ["cloudgames"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Requests per second (by service)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_received_total[1m])) by (service)", "legendFormat": "{{service}}", "refId": "A" }]
        },
        {
          "id": 2,
          "title": "HTTP request duration p95 (seconds)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le))", "legendFormat": "{{service}} p95", "refId": "A" }]
        },
        {
          "id": 3,
          "title": "Status code distribution",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_received_total[1m])) by (code)", "legendFormat": "HTTP {{code}}", "refId": "A" }]
        },
        {
          "id": 4,
          "title": "In-flight requests",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "sum(http_requests_in_progress) by (service)", "legendFormat": "{{service}}", "refId": "A" }]
        },
        {
          "id": 5,
          "title": ".NET GC heap size (MB)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{ "expr": "dotnet_total_memory_bytes / 1024 / 1024", "legendFormat": "{{service}}", "refId": "A" }]
        },
        {
          "id": 6,
          "title": "Process CPU (seconds)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{ "expr": "rate(process_cpu_seconds_total[1m])", "legendFormat": "{{service}}", "refId": "A" }]
        },
        {
          "id": 7,
          "title": "Application Logs (cloudgames:logs)",
          "type": "table",
          "datasource": { "type": "redis-datasource", "uid": "redis" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 24 },
          "options": {
            "sortBy": [{ "displayName": "timestamp", "desc": true }],
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": { "custom": { "width": 0 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "timestamp" }, "properties": [{ "id": "custom.width", "value": 200 }] },
              { "matcher": { "id": "byName", "options": "level"     }, "properties": [{ "id": "custom.width", "value": 90  }] },
              { "matcher": { "id": "byName", "options": "service"   }, "properties": [{ "id": "custom.width", "value": 160 }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "redis-datasource", "uid": "redis" },
              "command": "xrevrange",
              "query": "cloudgames:logs",
              "keyName": "cloudgames:logs",
              "count": "100",
              "type": "xrevrange"
            }
          ]
        }
      ]
    }
