apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: users-api
        metrics_path: /metrics
        static_configs:
          - targets: ["users-api-service:80"]
            labels:
              service: users-api

      - job_name: catalog-api
        metrics_path: /metrics
        static_configs:
          - targets: ["catalog-api-service:80"]
            labels:
              service: catalog-api

      - job_name: payments-api
        metrics_path: /metrics
        static_configs:
          - targets: ["payments-api-service:80"]
            labels:
              service: payments-api
