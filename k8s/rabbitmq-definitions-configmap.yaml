apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
data:
  definitions.json: |
    {
      "rabbit_version": "3.13.0",
      "users": [
        { "name": "guest", "password": "guest", "tags": "administrator" }
      ],
      "vhosts": [
        { "name": "/" }
      ],
      "permissions": [
        { "user": "guest", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*" }
      ],
      "queues": [
        { "name": "UserCreated",      "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} },
        { "name": "PaymentProcessed", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {} }
      ],
      "exchanges": [
        {
          "name": "UserCreatedIntegrationEvent",
          "vhost": "/", "type": "fanout", "durable": true, "auto_delete": false, "internal": false, "arguments": {}
        },
        {
          "name": "PaymentProcessedEvent",
          "vhost": "/", "type": "fanout", "durable": true, "auto_delete": false, "internal": false, "arguments": {}
        }
      ],
      "bindings": [
        {
          "source": "UserCreatedIntegrationEvent",
          "vhost": "/", "destination": "UserCreated", "destination_type": "queue", "routing_key": "", "arguments": {}
        },
        {
          "source": "PaymentProcessedEvent",
          "vhost": "/", "destination": "PaymentProcessed", "destination_type": "queue", "routing_key": "", "arguments": {}
        }
      ]
    }
