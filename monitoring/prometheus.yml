global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: users-api
    metrics_path: /metrics
    static_configs:
      - targets: ["users-api:8080"]
        labels:
          service: users-api

  - job_name: catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api:8080"]
        labels:
          service: catalog-api

  - job_name: payments-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payments-api:8080"]
        labels:
          service: payments-api

  - job_name: notifications-api
    metrics_path: /metrics
    static_configs:
      - targets: ["notifications-api:8080"]
        labels:
          service: notifications-api
