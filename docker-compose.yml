version: "3.9"

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - ./Notification/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - cloudgames-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mongo
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudgames-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    networks:
      - cloudgames-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    hostname: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - cloudgames-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  users-api:
    build:
      context: ./User
      dockerfile: /Dockerfile
    container_name: users-api
    ports:
      - "5001:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudgames-network
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - JWT_SECRET=dev-local-jwt-secret-0123456789-0123456789
      - MongoSettings__ConnectionString=mongodb://mongo:27017
      - MongoSettings__Database=cloudgames_users
      - Redis__ConnectionString=redis:6379
      - Redis__LogStream=cloudgames:logs

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    hostname: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - cloudgames-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10

  notifications-functions:
    build:
      context: ./Notification
      dockerfile: Dockerfile
    container_name: notifications-functions
    ports:
      - "5002:80"
    depends_on:
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - cloudgames-network
    environment:
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OGDouqEgUl1s4Rt0mEKI4OdVNt6Eok4;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - RabbitMQConnection=amqp://guest:guest@rabbitmq:5672/
      - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false
      - Redis__ConnectionString=redis:6379
      - Redis__LogStream=cloudgames:logs

  payments-api:
    build:
      context: ./FIAP.Payments
      dockerfile: Dockerfile
    container_name: payments-api
    ports:
      - "5003:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudgames-network
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - Redis__ConnectionString=redis:6379
      - Redis__LogStream=cloudgames:logs

  catalog-api:
    build:
      context: ./FIAP.Catalog
      dockerfile: Dockerfile
    container_name: catalog-api
    ports:
      - "5004:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cloudgames-network
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - JWT_SECRET=dev-local-jwt-secret-0123456789-0123456789
      - MongoSettings__ConnectionString=mongodb://mongo:27017
      - MongoSettings__Database=cloudgames_catalog
      - Redis__ConnectionString=redis:6379
      - Redis__LogStream=cloudgames:logs
      - Elasticsearch__Url=http://elasticsearch:9200

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - cloudgames-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cloudgames-network

networks:
  cloudgames-network:
    driver: bridge

volumes:
  mongo-data:
  prometheus-data:
  grafana-data: